[workspace]
members = ["commons"]
resolver = "2"

[workspace.dependencies]
anchor-lang = "1.0.2"
anchor-spl = "1.0.2"
bytemuck = { version = "1.25.0", features = [
    "derive",
    "min_const_generics",
    "must_cast",
] }
ruint = "1.3.0"
num_enum = "0.7.0"
num-integer = "0.1.45"
spl-transfer-hook-interface = "2.1.0"

[profile.release]
overflow-checks = true
