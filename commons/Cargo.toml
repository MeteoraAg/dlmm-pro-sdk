[package]
name = "dlmm-pro-commons"
version = "0.1.1"
edition = "2021"
description = "Off-chain commons library for integrating the DLMM Pro program"
repository = "https://github.com/MeteoraAg/dlmm-pro-sdk"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("idl-build", "anchor-debug"))',
] }

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
bytemuck = { workspace = true }
ruint = { workspace = true }
num_enum = { workspace = true }
num-integer = { workspace = true }
spl-transfer-hook-interface = { workspace = true }

[dev-dependencies]
litesvm = "0.15.2"
litesvm-token = "0.15.2"
serde_json = "1"
solana-clock = "3.1.1"
solana-keypair = "3.1.2"
solana-program-pack = "3.1.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "2", features = ["bincode"] }
solana-transaction = { version = "4.1.5", features = ["verify"] }
spl-tlv-account-resolution = "0.11.1"
tokio = { version = "1", features = ["macros", "rt"] }
# litesvm 0.15.2 does not compile against agave 4.2.1 (ExecutionRecord field
# rename); hold the agave runtime crates at 4.1.x until a fixed litesvm ships.
solana-transaction-context = ">=4.1.1,<4.2"
